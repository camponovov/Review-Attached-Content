<h1>Checklist Uscita Collaboratore</h1><p>Versione locale ricostruita esclusivamente dalle attività presenti nella Guida HR.</p>
<div class="meta"><div>Collaboratore<div class="field"></div></div><div>Data di uscita<div class="field"></div></div><div>Ruolo<div class="field"></div></div><div>Referente HR<div class="field"></div></div></div>
<section class="card"><h2>1 · Transizione e consegne</h2>
<label><input type="checkbox"> Pianificare il passaggio di consegne e documentare stato delle attività.</label>
<label><input type="checkbox"> Gestire sospensione dell’account Google e deviazione delle e-mail quando prevista.</label>
<label><input type="checkbox"> Allineare con il responsabile gli appuntamenti in agenda.</label>
<label><input type="checkbox"> Chiedere al Marketing la rimozione dell’immagine dal sito.</label></section>
<section class="card"><h2>2 · Sicurezza e accessi</h2>
<label><input type="checkbox"> Disattivare gestionale interno, drive condivisi e piattaforme operative.</label>
<label><input type="checkbox"> Rimuovere l’impronta digitale per l’ingresso in ufficio.</label>
<label><input type="checkbox"> Aggiornare l’organigramma in N Space One Stop.</label>
<label><input type="checkbox"> Valutare un profilo temporaneo con accessi limitati durante la transizione.</label></section>
<section class="card"><h2>3 · Feedback</h2>
<label><input type="checkbox"> Svolgere il colloquio di uscita.</label>
<label><input type="checkbox"> Raccogliere motivazioni, criticità, aspetti positivi e suggerimenti.</label></section>
<section class="card"><h2>4 · Restituzione materiale</h2>
<label><input type="checkbox"> Computer aziendale.</label><label><input type="checkbox"> Chiavetta della macchinetta.</label><label><input type="checkbox"> Chiavi degli uffici senza ingresso a impronta.</label><label><input type="checkbox"> Libri e materiali formativi.</label><label><input type="checkbox"> Badge e altri strumenti operativi.</label></section>
